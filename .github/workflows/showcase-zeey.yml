name: Videos Zeey - portfolio animado
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install edge-tts==7.3.1
          cd animacao/showcase
          npm install
          npx remotion browser ensure
      - name: Preparar voz e identidade
        run: |
          mkdir -p animacao/showcase/public animacao/showcase/out
          cp animacao/fonts/switzer-500.ttf animacao/fonts/switzer-700.ttf animacao/showcase/public/
          cp animacao/assets/trilha.mp3 animacao/showcase/public/
          python animacao/showcase/gerar_voz.py
      - name: Renderizar tres demonstracoes
        working-directory: animacao/showcase
        run: |
          for id in Augusto Conversa Nexo; do
            npx remotion render src/index.tsx "Zeey$id" "out/$id.mp4" --gl=swangle --concurrency=2 --crf=18
          done
      - uses: actions/upload-artifact@v4
        with:
          name: zeey-portfolio-tres-videos
          path: animacao/showcase/out/*.mp4
          if-no-files-found: error
          retention-days: 7
